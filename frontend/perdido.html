<!-- Indica que el documento utiliza HTML5 -->
<!DOCTYPE html>

<!-- Inicia el documento HTML y establece el idioma español -->
<html lang="es">

<!-- Inicia la sección de configuración del documento -->
<head>

    <!-- Permite utilizar correctamente caracteres especiales como á, é, í, ó, ú y ñ -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte correctamente al tamaño de la pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define el título que aparecerá en la pestaña del navegador -->
    <title>Reportar objeto perdido</title>

    <!-- Acceso al archivo de que va dar el estilo de liquid glass -->
    <link rel="stylesheet" href="css/reportes.css">

<!-- Finaliza la sección de configuración -->
</head>

<!-- Inicia el contenido visible de la página -->
<body class="pagina-reporte pagina-perdido">

    <main class="contenedor-reporte">

        <!-- Contenedor superior -->
        <header class="encabezado-reporte">
            <h1>Reportar objeto perdido</h1>

            <h2>Registrar objeto perdido</h2>

            <p>
                Completa la información del objeto que perdiste.
            </p>
        </header>

        <!-- Contenedor del formulario -->
        <section class="panel-formulario">

            <form
                action="../backend/objetos.php"
                method="POST"
                enctype="multipart/form-data"
                class="formulario-reporte"
            >

                <input type="hidden" name="accion" value="perdido">

                <div class="campo-formulario">
                    <label for="nombre">Nombre del objeto:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>

                <div class="campo-formulario">
                    <label for="categoria">Categoría:</label>

                    <select id="categoria" name="categoria_id" required>
                        <option value="">Selecciona una categoría</option>
                        <option value="1">Electrónica</option>
                        <option value="2">Documentos</option>
                        <option value="3">Accesorios</option>
                        <option value="4">Ropa</option>
                        <option value="5">Material escolar</option>
                        <option value="6">Otros</option>
                    </select>
                </div>

                <div class="campo-formulario">
                    <label for="descripcion_publica">
                        Descripción pública:
                    </label>

                    <textarea
                        id="descripcion_publica"
                        name="descripcion_publica"
                        rows="4"
                        placeholder="Describe el objeto de manera general"
                        required
                    ></textarea>
                </div>

                <div class="campo-formulario">
                    <label for="descripcion_privada">
                        Descripción privada:
                    </label>

                    <textarea
                        id="descripcion_privada"
                        name="descripcion_privada"
                        rows="3"
                        placeholder="Escribe características que solo el dueño pueda conocer"
                    ></textarea>
                </div>

                <div class="campo-formulario">
                    <label for="color">Color:</label>
                    <input type="text" id="color" name="color">
                </div>

                <div class="campo-formulario">
                    <label for="fecha">Fecha en que se perdió:</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="campo-formulario">
                    <label for="imagen">Fotografía del objeto:</label>
                    <input
                        type="file"
                        id="imagen"
                        name="imagen"
                        accept="image/*"
                    >
                </div>

                <!-- Botones debajo de los campos -->
                <div class="acciones-formulario">
                    <a href="index.php" class="boton-formulario boton-cancelar">
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="boton-formulario boton-registrar"
                    >
                        Registrar
                    </button>
                </div>

            </form>

        </section>

    <!-- Inicia el pie de página -->
    <footer>

        <!-- Inicia un párrafo -->
        <p>
            Universidad Veracruzana - Facultad
        </p>

    <!-- Finaliza el párrafo -->
    </footer>

<!-- Finaliza el contenido visible de la página -->
</body>

<!-- Finaliza el documento HTML -->
</html>
