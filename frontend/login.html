<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión · UV</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Logo UV -->
        <div class="logo">
            <img src="img/logo-uv.png" alt="Logo UV" class="logo-img">
        </div>

        <h1 class="title">Iniciar sesión</h1>

        <!-- Formulario principal -->
        <div class="login-box">
            <form id="formLogin" action="../backend/auth.php" method="POST">
                <input type="hidden" name="accion" value="login">

                <div class="form-group">
                    <label for="correo">Correo electrónico institucional</label>
                    <input type="email" id="correo" name="correo" placeholder="zS12345678@estudiantes.uv.mx" required autocomplete="username">
                </div>

                <div class="form-group">
                    <div class="form-header">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="btnLogin">Ingresar</button>
             
            </form>

            <p id="mensaje" class="mensaje-formulario"
                role="status" aria-live="polite" hidden></p>
                                   
        </div>

        <!-- Caja inferior para enlace de registro -->
        <div class="signup-box">
            ¿Eres nuevo? <a href="registro.html">Crea una cuenta</a>.
        </div>

        
    </div>

    
<script>
    const formulario = document.getElementById('formLogin');
    const mensaje = document.getElementById('mensaje');
    const boton = document.getElementById('btnLogin');

    function mostrarMensaje(texto, tipo = 'error') {
        mensaje.textContent = texto;
        mensaje.className = 'mensaje-formulario ' + tipo;
        mensaje.hidden = false;
    }

    formulario.addEventListener('submit', async function(evento) {
        evento.preventDefault();

        // Validar los campos antes de enviar.
        if (!formulario.checkValidity()) {
            formulario.reportValidity();
            return;
        }

        boton.disabled = true;
        mostrarMensaje('Verificando datos...', 'info');

        try {
            const respuesta = await fetch(formulario.action, {
                method: 'POST',
                body: new FormData(formulario)
            });

            // auth.php debe responder JSON en los errores.
            const resultado = await respuesta.json();

            if (resultado.exito && resultado.destino) {
                mostrarMensaje(resultado.mensaje, 'exito');
                window.location.href = resultado.destino;
                return;
            }

            mostrarMensaje(
                resultado.mensaje || 'No fue posible iniciar sesión.',
                'error'
            );

        } catch (error) {
            mostrarMensaje(
                'No se pudo procesar la respuesta del servidor. Revisa auth.php.',
                'error'
            );
            console.error('Error en el inicio de sesión:', error);

        } finally {
            boton.disabled = false;
        }
    });
</script>


</body>
</html>
